name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python3 scripts/test-growth.py
      - run: python3 scripts/test-cli.py
      - name: Check reproducible packaging
        run: |
          python3 scripts/build.py --output build/rebuilt.jar
          cmp build/nullfuscator-obf.jar build/rebuilt.jar
      - name: Package release candidate
        if: matrix.java == '21'
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.java == '21'
        with:
          name: nullfuscator-release-candidate
          path: build/release/*
          if-no-files-found: error
